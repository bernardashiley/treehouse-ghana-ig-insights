<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380"
  viewBox="0 0 700 380" role="img" aria-label="Short videos vs feed posts comparison">
<title>Short videos vs feed posts comparison</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>

<text x="350" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20"
  font-weight="bold" fill="#1B3A2D" text-anchor="middle">Posts vs Short Videos</text>
<text x="350" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13"
  font-weight="normal" fill="#6B7280" text-anchor="middle">Average interaction by content format (this account)</text>
<rect x="180" y="221" width="70" height="59" fill="#2E86AB" rx="3"/>
<text x="215" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13"
  font-weight="bold" fill="#2E86AB" text-anchor="middle">103</text>
<text x="215" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12"
  font-weight="normal" fill="#6B7280" text-anchor="middle">Feed Posts</text>
<rect x="270" y="80" width="70" height="200" fill="#7B2D8B" rx="3"/>
<text x="305" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13"
  font-weight="bold" fill="#7B2D8B" text-anchor="middle">350</text>
<text x="305" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12"
  font-weight="normal" fill="#6B7280" text-anchor="middle">Short Videos</text>
<text x="260" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14"
  font-weight="bold" fill="#1F2937" text-anchor="middle">Average Engagement</text>
<line x1="175" y1="280" x2="350" y2="280" stroke="#D1D5DB" stroke-width="1.5"/>
<rect x="520" y="260" width="70" height="20" fill="#2E86AB" rx="3"/>
<text x="555" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13"
  font-weight="bold" fill="#2E86AB" text-anchor="middle">35</text>
<text x="555" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12"
  font-weight="normal" fill="#6B7280" text-anchor="middle">Feed Posts</text>
<rect x="610" y="132" width="70" height="148" fill="#7B2D8B" rx="3"/>
<text x="645" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13"
  font-weight="bold" fill="#7B2D8B" text-anchor="middle">259</text>
<text x="645" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12"
  font-weight="normal" fill="#6B7280" text-anchor="middle">Short Videos</text>
<text x="600" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14"
  font-weight="bold" fill="#1F2937" text-anchor="middle">Median Engagement</text>
<line x1="515" y1="280" x2="690" y2="280" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="450" y="170" font-family="Arial, Helvetica, sans-serif"
    font-size="26" fill="#7B2D8B" text-anchor="middle" font-weight="bold">+241%</text>
  <text x="450" y="194" font-family="Arial, Helvetica, sans-serif"
    font-size="13" fill="#7B2D8B" text-anchor="middle">more engagement</text>
  <text x="450" y="212" font-family="Arial, Helvetica, sans-serif"
    font-size="12" fill="#6B7280" text-anchor="middle">from short videos</text>
<rect x="30" y="350" width="14" height="14" fill="#2E86AB" rx="3"/>
<text x="50" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12"
  font-weight="normal" fill="#6B7280" text-anchor="start">Feed Posts (images/carousels)</text>
<rect x="260" y="350" width="14" height="14" fill="#7B2D8B" rx="3"/>
<text x="280" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12"
  font-weight="normal" fill="#6B7280" text-anchor="start">Short Videos (Reels)</text>

</svg>